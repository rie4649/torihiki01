<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取引確認書</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#eef1f5;
  color:#222;
}
.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:16px;
  padding:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
  margin-bottom:20px;
}
h1,h2{
  text-align:center;
  margin:10px 0 20px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
label{
  font-weight:bold;
  display:block;
  margin-bottom:5px;
}
input,select,textarea{
  width:100%;
  padding:11px;
  font-size:16px;
  box-sizing:border-box;
  border:1px solid #bbb;
  border-radius:8px;
}
textarea{
  min-height:90px;
}
.full{
  grid-column:1 / -1;
}
.btns{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:18px;
}
button{
  padding:14px;
  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.primary{background:#0b63ce;color:white;}
.dark{background:#111;color:white;}
.gray{background:#ddd;color:#111;}
.previewBox{
  border:2px dashed #999;
  border-radius:12px;
  padding:12px;
  background:#fafafa;
  text-align:center;
}
.previewBox img{
  max-width:100%;
  max-height:300px;
}
.paper{
  width:794px;
  min-height:1123px;
  background:white;
  margin:20px auto;
  padding:50px;
  box-sizing:border-box;
  border:1px solid #ccc;
}
.paper h1{
  letter-spacing:8px;
  border-bottom:3px double #111;
  padding-bottom:12px;
}
.info{
  display:grid;
  grid-template-columns:180px 1fr;
  border-top:1px solid #333;
  border-left:1px solid #333;
  margin-top:25px;
}
.info div{
  padding:11px;
  border-right:1px solid #333;
  border-bottom:1px solid #333;
  min-height:24px;
}
.head{
  background:#f0f0f0;
  font-weight:bold;
}
.docImg{
  margin-top:25px;
  border:1px solid #333;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.docImg img{
  max-width:100%;
  max-height:330px;
}
.sign{
  margin-top:40px;
  display:flex;
  justify-content:space-between;
}
.small{
  font-size:13px;
  color:#666;
}
@media(max-width:850px){
  .grid{grid-template-columns:1fr;}
  .btns{grid-template-columns:1fr;}
  .paper{
    width:100%;
    min-height:auto;
    padding:25px;
  }
}
@media print{
  .card:first-child{display:none;}
  body{background:white;}
  .wrap{margin:0;padding:0;}
  .card{box-shadow:none;margin:0;padding:0;}
  .paper{border:none;margin:0;width:100%;}
}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>取引確認書 作成画面</h1>

<div class="grid">

<div>
<label>受付番号</label>
<input id="receiptNo" readonly>
</div>

<div>
<label>取引日</label>
<input type="date" id="tradeDate">
</div>

<div>
<label>テンプレート</label>
<select id="template">
<option>最新テンプレート</option>
<option>通常取引</option>
<option>本人確認あり</option>
<option>現金取引</option>
<option>貴金属取引</option>
<option>ブランド品取引</option>
</select>
</div>

<div>
<label>担当者</label>
<select id="staff">
<option>古川</option>
<option>石原</option>
<option>宮嶋</option>
<option>長村</option>
<option>川村</option>
</select>
</div>

<div>
<label>氏名</label>
<input id="name" placeholder="例：川村 理絵">
</div>

<div>
<label>生年月日</label>
<input type="date" id="birthday">
</div>

<div class="full">
<label>住所</label>
<input id="address" placeholder="住所を入力">
</div>

<div>
<label>確認書類</label>
<select id="docType">
<option>運転免許証</option>
<option>マイナンバーカード</option>
<option>在留カード</option>
<option>その他</option>
</select>
</div>

<div>
<label>本人確認書類番号</label>
<input id="docNo" placeholder="免許証番号など">
</div>

<div class="full">
<label>備考欄</label>
<textarea id="memo" placeholder="取引内容・査定内容・注意事項など"></textarea>
</div>

<div class="full">
<label>本人確認書類 PDF / 画像アップロード</label>
<input type="file" id="fileInput" accept="image/*,application/pdf">
<p class="small">PDFの場合は1ページ目を画像化して表示します。</p>
<div class="previewBox">
<img id="preview" alt="ここに確認書類が表示されます">
</div>
</div>

</div>

<div class="btns">
<button class="primary" onclick="saveCustomer()">顧客保存</button>
<button class="dark" onclick="makePDF()">PDF保存</button>
<button class="gray" onclick="window.print()">印刷</button>
</div>

</div>

<div class="card">
<div id="paper" class="paper">
<h1>取引確認書</h1>

<div class="info">
<div class="head">受付番号</div><div id="pReceipt"></div>
<div class="head">取引日</div><div id="pDate"></div>
<div class="head">テンプレート</div><div id="pTemplate"></div>
<div class="head">氏名</div><div id="pName"></div>
<div class="head">住所</div><div id="pAddress"></div>
<div class="head">生年月日</div><div id="pBirthday"></div>
<div class="head">確認書類</div><div id="pDocType"></div>
<div class="head">本人確認書類番号</div><div id="pDocNo"></div>
<div class="head">担当者</div><div id="pStaff"></div>
<div class="head">備考</div><div id="pMemo"></div>
</div>

<h2>本人確認書類</h2>
<div class="docImg">
<img id="pPreview">
</div>

<div class="sign">
<div>確認者署名：________________</div>
<div>お客様署名：________________</div>
</div>

<p class="small">
上記内容に基づき、本人確認および取引確認を行いました。
</p>
</div>
</div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const ids = [
"receiptNo","tradeDate","template","staff","name",
"birthday","address","docType","docNo","memo"
];

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function makeReceiptNo(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  const n = String(Math.floor(Math.random()*900)+100);
  return y + m + day + "-" + n;
}

tradeDate.value = todayStr();
receiptNo.value = makeReceiptNo();

ids.forEach(id=>{
  document.getElementById(id).addEventListener("input", updatePaper);
});

function updatePaper(){
  pReceipt.textContent = receiptNo.value;
  pDate.textContent = tradeDate.value;
  pTemplate.textContent = template.value;
  pName.textContent = name.value;
  pAddress.textContent = address.value;
  pBirthday.textContent = birthday.value;
  pDocType.textContent = docType.value;
  pDocNo.textContent = docNo.value;
  pStaff.textContent = staff.value;
  pMemo.textContent = memo.value;
}
updatePaper();

fileInput.addEventListener("change", async function(e){
  const file = e.target.files[0];
  if(!file) return;

  if(file.type.startsWith("image/")){
    const url = URL.createObjectURL(file);
    preview.src = url;
    pPreview.src = url;
    return;
  }

  if(file.type === "application/pdf"){
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buffer}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale:2});
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext:ctx, viewport:viewport}).promise;
    const img = canvas.toDataURL("image/png");
    preview.src = img;
    pPreview.src = img;
  }
});

function saveCustomer(){
  const data = {
    name:name.value,
    address:address.value,
    birthday:birthday.value,
    docType:docType.value,
    docNo:docNo.value,
    memo:memo.value,
    date:tradeDate.value
  };

  if(!data.name){
    alert("氏名を入力してください");
    return;
  }

  let customers = JSON.parse(localStorage.getItem("customers") || "[]");
  customers.push(data);
  localStorage.setItem("customers", JSON.stringify(customers));
  alert("顧客情報をこの端末に保存しました");
}

async function makePDF(){
  updatePaper();

  const { jsPDF } = window.jspdf;
  const paperEl = document.getElementById("paper");

  const canvas = await html2canvas(paperEl, {
    scale:2,
    useCORS:true
  });

  const imgData = canvas.toDataURL("image/png");
  const pdf = new jsPDF("p","mm","a4");

  pdf.addImage(imgData, "PNG", 0, 0, 210, 297);
  pdf.save("取引確認書_" + receiptNo.value + ".pdf");
}
</script>

</body>
</html>
