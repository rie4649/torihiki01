<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取引確認書</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropper/1.6.2/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropper/1.6.2/cropper.min.js"></script>
<style>
body{margin:0;font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif;background:#eef1f5;color:#222}
.wrap{max-width:1100px;margin:20px auto;padding:15px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.12);margin-bottom:20px}
h1{text-align:center;margin:10px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:bold;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;font-size:16px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}
textarea{min-height:90px}
.full{grid-column:1 / -1}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
button{padding:14px;font-size:16px;font-weight:bold;border:none;border-radius:10px;cursor:pointer}
.blue{background:#0b63ce;color:white}
.dark{background:#111;color:white}
.gray{background:#ddd;color:#111}
.previewBox{border:2px dashed #999;border-radius:12px;padding:12px;background:#fafafa;text-align:center}
.previewBox img{max-width:100%;max-height:300px}
.ocrBox{background:#fff8df;border:2px solid #e3c45f;border-radius:12px;padding:12px;margin-top:12px}
.paper{width:794px;min-height:1123px;background:white;margin:20px auto;padding:50px;box-sizing:border-box;border:1px solid #ccc}
.paper h1{letter-spacing:8px;border-bottom:3px double #111;padding-bottom:12px}
.info{display:grid;grid-template-columns:180px 1fr;border-top:1px solid #333;border-left:1px solid #333;margin-top:25px}
.info div{padding:11px;border-right:1px solid #333;border-bottom:1px solid #333;min-height:24px}
.head{background:#f0f0f0;font-weight:bold}
.docTitle{margin-top:28px;font-size:20px;font-weight:bold;border-bottom:2px solid #111;padding-bottom:6px}
.docImg{margin-top:15px;border:1px solid #333;min-height:330px;display:flex;align-items:center;justify-content:center;background:#fff}
.docImg img{max-width:100%;max-height:390px}
.small{font-size:13px;color:#666;line-height:1.7}

/* ===== 免許証トリミング用モーダル ===== */
.cropModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;align-items:center;justify-content:center;padding:16px}
.cropModal.show{display:flex;flex-direction:column}
.cropWrap{background:#fff;border-radius:12px;padding:14px;max-width:640px;width:100%;max-height:70vh;overflow:auto;margin:0 auto}
.cropWrap img{max-width:100%;display:block}
.cropHint{color:#fff;text-align:center;font-size:13px;margin:10px auto 0;max-width:640px}
.cropBtns{display:flex;gap:10px;margin:12px auto 0;width:100%;max-width:640px}
.cropBtns button{flex:1}

@media(max-width:850px){
.grid{grid-template-columns:1fr}
.btns{grid-template-columns:1fr}
.paper{width:100%;min-height:auto;padding:25px}
}
@media print{
.inputCard{display:none}
body{background:white}
.wrap{margin:0;padding:0}
.card{box-shadow:none;margin:0;padding:0}
.paper{border:none;margin:0;width:100%}
}
</style>
</head>
<body>

<div class="wrap">
<div class="card inputCard">
<h1>取引確認書 作成画面</h1>
<div class="grid">

<div>
<label>受付番号</label>
<input id="receiptNo" readonly>
</div>

<div>
<label>取引日</label>
<input type="date" id="tradeDate">
</div>

<div>
<label>テンプレート</label>
<select id="template">
<option>本人確認あり</option>
<option>その他</option>
</select>
</div>

<div>
<label>担当者</label>
<select id="staff">
<option>古川</option>
<option>石原</option>
<option>宮嶋</option>
<option>長村</option>
<option>川村</option>
</select>
</div>

<div>
<label>氏名</label>
<input id="name" placeholder="例：川村 理絵">
</div>

<div>
<label>生年月日</label>
<input type="date" id="birthday">
</div>

<div class="full">
<label>住所</label>
<input id="address" placeholder="住所を入力">
</div>

<div>
<label>確認書類</label>
<select id="docType">
<option>運転免許証</option>
<option>マイナンバーカード</option>
<option>在留カード</option>
<option>その他</option>
</select>
</div>

<div>
<label>本人確認書類番号</label>
<input id="docNo" placeholder="免許証番号・カード番号など">
</div>

<div class="full">
<label>備考欄</label>
<textarea id="memo" placeholder="取引内容・査定内容・注意事項など"></textarea>
</div>

<div class="full">
<label>本人確認書類 PDF / 画像アップロード</label>
<input type="file" id="fileInput" accept="image/*,application/pdf">
<p class="small">PDFや画像の白い余白をできるだけ自動でカットして表示します。</p>
<div class="previewBox">
<img id="preview" alt="ここに確認書類が表示されます">
</div>

<button class="gray" id="cropBtn" onclick="openCropper()" style="margin-top:10px;width:100%;">📐 免許証サイズに切り取る</button>
<p class="small">画像の中の免許証部分をマウスでドラッグして囲むと、決まった縦横比で切り取れます。OCRの精度も上がります。</p>

<button class="blue" onclick="runOCR()" style="margin-top:12px;width:100%;">OCRで文字を読み取る</button>
<div class="ocrBox">
<label>OCR読み取り結果</label>
<textarea id="ocrText" placeholder="ここに読み取った文字が表示されます"></textarea>
<button class="blue" onclick="autofillFromOCR()" style="margin-top:10px;width:100%;">📝 読み取り結果から自動入力</button>
<p class="small">OCR完了後は自動で入力を試みますが、誤認識もあるため、氏名・住所・生年月日・番号は必ず見比べて修正してください。</p>
</div>
</div>

</div>

<div class="btns">
<button class="dark" onclick="makePDF()">PDF保存</button>
<button class="gray" onclick="window.print()">印刷</button>
<button class="gray" onclick="clearForm()">入力クリア</button>
</div>
</div>

<div class="card">
<div id="paper" class="paper">
<h1>取引確認書</h1>
<div class="info">
<div class="head">受付番号</div><div id="pReceipt"></div>
<div class="head">取引日</div><div id="pDate"></div>
<div class="head">テンプレート</div><div id="pTemplate"></div>
<div class="head">氏名</div><div id="pName"></div>
<div class="head">住所</div><div id="pAddress"></div>
<div class="head">生年月日</div><div id="pBirthday"></div>
<div class="head">確認書類</div><div id="pDocType"></div>
<div class="head">本人確認書類番号</div><div id="pDocNo"></div>
<div class="head">担当者</div><div id="pStaff"></div>
<div class="head">備考</div><div id="pMemo"></div>
</div>
<div class="docTitle">本人確認書類</div>
<div class="docImg">
<img id="pPreview">
</div>
<p class="small">上記内容に基づき、本人確認および取引確認を行いました。</p>
</div>
</div>
</div>

<!-- ===== 免許証トリミング モーダル ===== -->
<div class="cropModal" id="cropModal">
  <div class="cropWrap">
    <img id="cropImage">
  </div>
  <p class="cropHint">まず🔍+で免許証部分を拡大し、次に枠をドラッグして免許証の四隅に合わせてください</p>
  <div class="cropBtns">
    <button class="gray" onclick="zoomCropper(0.2)">🔍＋ 拡大</button>
    <button class="gray" onclick="zoomCropper(-0.2)">🔍－ 縮小</button>
    <button class="gray" onclick="resetCropBox()">↺ 枠をリセット</button>
  </div>
  <div class="cropBtns">
    <button class="blue" onclick="confirmCrop()">この位置で切り取る</button>
    <button class="gray" onclick="closeCropper()">キャンセル</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let ocrImageData = "";
let cropper = null;
// 運転免許証の実寸(85.6mm × 54.0mm)の縦横比
const LICENSE_RATIO = 85.6 / 54.0;

const ids = [
"receiptNo","tradeDate","template","staff","name",
"birthday","address","docType","docNo","memo"
];

function todayStr(){
const d = new Date();
return d.toISOString().slice(0,10);
}

function makeReceiptNo(){
const d = new Date();
const y = d.getFullYear();
const m = String(d.getMonth()+1).padStart(2,"0");
const day = String(d.getDate()).padStart(2,"0");
const n = String(Math.floor(Math.random()*900)+100);
return y + m + day + "-" + n;
}

tradeDate.value = todayStr();
receiptNo.value = makeReceiptNo();

ids.forEach(id=>{
document.getElementById(id).addEventListener("input", updatePaper);
});

function updatePaper(){
pReceipt.textContent = receiptNo.value;
pDate.textContent = tradeDate.value;
pTemplate.textContent = template.value;
pName.textContent = name.value;
pAddress.textContent = address.value;
pBirthday.textContent = birthday.value;
pDocType.textContent = docType.value;
pDocNo.textContent = docNo.value;
pStaff.textContent = staff.value;
pMemo.textContent = memo.value;
}
updatePaper();

function cropWhiteSpace(sourceCanvas){
const ctx = sourceCanvas.getContext("2d");
const w = sourceCanvas.width;
const h = sourceCanvas.height;
const data = ctx.getImageData(0,0,w,h).data;
let top = h, left = w, right = 0, bottom = 0;
const threshold = 245;
for(let y=0; y<h; y++){
for(let x=0; x<w; x++){
const i = (y*w+x)*4;
const r = data[i];
const g = data[i+1];
const b = data[i+2];
const a = data[i+3];
if(a > 20 && !(r > threshold && g > threshold && b > threshold)){
if(x < left) left = x;
if(x > right) right = x;
if(y < top) top = y;
if(y > bottom) bottom = y;
}
}
}
if(right <= left || bottom <= top){
return sourceCanvas.toDataURL("image/png");
}
const padding = 25;
left = Math.max(0, left - padding);
top = Math.max(0, top - padding);
right = Math.min(w, right + padding);
bottom = Math.min(h, bottom + padding);
const cropW = right - left;
const cropH = bottom - top;
const newCanvas = document.createElement("canvas");
newCanvas.width = cropW;
newCanvas.height = cropH;
const newCtx = newCanvas.getContext("2d");
newCtx.drawImage(
sourceCanvas,
left, top, cropW, cropH,
0, 0, cropW, cropH
);
return newCanvas.toDataURL("image/png");
}

function imageFileToCroppedDataURL(file){
return new Promise((resolve)=>{
const img = new Image();
img.onload = function(){
const canvas = document.createElement("canvas");
canvas.width = img.width;
canvas.height = img.height;
const ctx = canvas.getContext("2d");
ctx.drawImage(img,0,0);
resolve(cropWhiteSpace(canvas));
};
img.src = URL.createObjectURL(file);
});
}

fileInput.addEventListener("change", async function(e){
const file = e.target.files[0];
if(!file) return;
preview.alt = "読み込み中…";

if(file.type.startsWith("image/")){
const cropped = await imageFileToCroppedDataURL(file);
preview.src = cropped;
pPreview.src = cropped;
ocrImageData = cropped;
return;
}

if(file.type === "application/pdf"){
const buffer = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({data:buffer}).promise;
const page = await pdf.getPage(1);
const viewport = page.getViewport({scale:3});
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
canvas.width = viewport.width;
canvas.height = viewport.height;
await page.render({
canvasContext:ctx,
viewport:viewport
}).promise;
const cropped = cropWhiteSpace(canvas);
preview.src = cropped;
pPreview.src = cropped;
ocrImageData = cropped;
}
});

/* ============================================================
   免許証サイズへのトリミング(Cropper.js)
   ============================================================ */
function openCropper(){
if(!preview.src){
alert("先に本人確認書類の画像をアップロードしてください");
return;
}
cropImage.src = preview.src;
cropModal.classList.add("show");
if(cropper){ cropper.destroy(); cropper = null; }
cropper = new Cropper(cropImage, {
aspectRatio: LICENSE_RATIO,
viewMode: 1,
autoCropArea: 0.25,
movable: true,
zoomable: true,
zoomOnWheel: true,
scalable: false,
background: false
});
}

function zoomCropper(ratio){
if(cropper) cropper.zoom(ratio);
}

function resetCropBox(){
if(cropper) cropper.reset();
}

function closeCropper(){
cropModal.classList.remove("show");
if(cropper){ cropper.destroy(); cropper = null; }
}

function confirmCrop(){
if(!cropper) return;
// 免許証の実寸に近い解像度で書き出す(OCR精度のため大きめに)
const canvas = cropper.getCroppedCanvas({
width: 1600,
height: Math.round(1600 / LICENSE_RATIO),
imageSmoothingEnabled: true,
imageSmoothingQuality: "high"
});
const dataUrl = canvas.toDataURL("image/png");
preview.src = dataUrl;
pPreview.src = dataUrl;
ocrImageData = dataUrl;
closeCropper();
}

/* ============================================================
   OCR精度向上のための前処理(グレースケール化 + コントラスト強調)
   ============================================================ */
function preprocessForOCR(dataUrl){
return new Promise((resolve)=>{
const img = new Image();
img.onload = ()=>{
// 画像が小さい場合は拡大してから処理する(文字を認識しやすくするため)
const minWidth = 1400;
const scale = img.width < minWidth ? (minWidth / img.width) : 1;
const canvas = document.createElement("canvas");
canvas.width = Math.round(img.width * scale);
canvas.height = Math.round(img.height * scale);
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
const data = imageData.data;
const contrast = 1.6; // コントラスト強調の強さ
for(let i=0; i<data.length; i+=4){
const gray = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
let val = (gray - 128) * contrast + 128;
val = Math.max(0, Math.min(255, val));
data[i] = data[i+1] = data[i+2] = val;
}
ctx.putImageData(imageData, 0, 0);
resolve(canvas.toDataURL("image/png"));
};
img.src = dataUrl;
});
}

async function runOCR(){
if(!ocrImageData){
alert("先に本人確認書類をアップロードしてください");
return;
}
ocrText.value = "画像を最適化しています…";
try{
const processedImage = await preprocessForOCR(ocrImageData);

ocrText.value = "読み取り中です。少し待ってください…";
const result = await Tesseract.recognize(
processedImage,
"jpn+eng",
{
logger: m => {
if(m.status === "recognizing text"){
const p = Math.round(m.progress * 100);
ocrText.value = "OCR読み取り中… " + p + "%";
}
}
}
);
ocrText.value = result.data.text || "文字を読み取れませんでした。画像を明るく、まっすぐ撮って再試行してください。";
if(result.data.text){
autofillFromOCR(true);
}
}catch(err){
ocrText.value = "OCRでエラーが出ました。画像で再アップロードして試してください。";
console.error(err);
}
}

/* ============================================================
   OCR結果から氏名・住所・生年月日・番号を自動入力
   ============================================================ */
function parseOCRText(text){
const result = {name:"", birthday:"", address:"", docNo:""};
const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);

// 免許証番号(12桁の数字)
const docNoMatch = text.replace(/\s/g,"").match(/\d{12}/);
if(docNoMatch){
result.docNo = docNoMatch[0];
}

// 生年月日(和暦)
const eraMap = {"明治":1868,"大正":1912,"昭和":1926,"平成":1989,"令和":2019};
const eraMatch = text.match(/(明治|大正|昭和|平成|令和)\s*(元|\d{1,2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
if(eraMatch){
const eraYear = eraMatch[2] === "元" ? 1 : parseInt(eraMatch[2],10);
const year = eraMap[eraMatch[1]] + eraYear - 1;
const month = String(parseInt(eraMatch[3],10)).padStart(2,"0");
const day = String(parseInt(eraMatch[4],10)).padStart(2,"0");
result.birthday = `${year}-${month}-${day}`;
}else{
// 西暦表記(例: 1990年05月01日 / 1990.05.01 / 1990-05-01)
const western = text.match(/((19|20)\d{2})[年.\-\/](\d{1,2})[月.\-\/](\d{1,2})日?/);
if(western){
const month = String(parseInt(western[3],10)).padStart(2,"0");
const day = String(parseInt(western[4],10)).padStart(2,"0");
result.birthday = `${western[1]}-${month}-${day}`;
}
}

// 住所(都道府県から始まる行)
const addressLine = lines.find(l => /^(北海道|(青森|岩手|宮城|秋田|山形|福島|茨城|栃木|群馬|埼玉|千葉|東京|神奈川|新潟|富山|石川|福井|山梨|長野|岐阜|静岡|愛知|三重|滋賀|京都|大阪|兵庫|奈良|和歌山|鳥取|島根|岡山|広島|山口|徳島|香川|愛媛|高知|福岡|佐賀|長崎|熊本|大分|宮崎|鹿児島|沖縄)[都道府県])/.test(l));
if(addressLine) result.address = addressLine;

// 氏名(数字を含まず、除外ワードにも当たらない短めの行)
const excludeKeywords = ["運転免許証","公安委員会","免許","本籍","有効期限","眼鏡等","種類","備考","氏名","生年月日","住所","交付","番号","第一種","第二種"];
const nameLine = lines.find(l=>{
if(l.length < 2 || l.length > 12) return false;
if(/\d/.test(l)) return false;
if(excludeKeywords.some(k=>l.includes(k))) return false;
if(addressLine && l === addressLine) return false;
return /^[ぁ-んァ-ヶ一-龠々ー\s　]+$/.test(l);
});
if(nameLine) result.name = nameLine.replace(/[\s　]+/g,"");

return result;
}

function autofillFromOCR(silent){
const text = ocrText.value;
if(!text || text.includes("読み取り中") || text.includes("最適化")){
if(!silent) alert("先にOCRを実行してください");
return;
}
const parsed = parseOCRText(text);
if(parsed.name) name.value = parsed.name;
if(parsed.birthday) birthday.value = parsed.birthday;
if(parsed.address) address.value = parsed.address;
if(parsed.docNo) docNo.value = parsed.docNo;
updatePaper();
if(!silent){
alert("読み取れた項目を自動入力しました。内容を確認・修正してください。");
}
}

async function makePDF(){
updatePaper();
if(!name.value){
alert("氏名を入力してください");
return;
}
const { jsPDF } = window.jspdf;
const paperEl = document.getElementById("paper");
const canvas = await html2canvas(paperEl, {
scale:2,
useCORS:true
});
const imgData = canvas.toDataURL("image/png");
const pdf = new jsPDF("p","mm","a4");
pdf.addImage(imgData, "PNG", 0, 0, 210, 297);
pdf.save("取引確認書_" + receiptNo.value + ".pdf");
}

function clearForm(){
if(!confirm("入力内容をクリアしますか？")) return;
name.value = "";
birthday.value = "";
address.value = "";
docNo.value = "";
memo.value = "";
ocrText.value = "";
preview.removeAttribute("src");
pPreview.removeAttribute("src");
ocrImageData = "";
receiptNo.value = makeReceiptNo();
tradeDate.value = todayStr();
updatePaper();
}
</script>
</body>
</html>
